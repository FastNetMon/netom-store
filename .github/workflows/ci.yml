name: CI

on:
  push:
    branches: [main, fnm-gc]
  pull_request:
    branches: [main, fnm-gc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }}, features ${{ matrix.args }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fnm-gc uses FastNetMon routecore, which requires Rust 1.88.
        rust: ["1.88.0", stable, beta, nightly]
        args: ["--no-default-features", "", "--all-features"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install Clippy
        if: matrix.rust == 'stable'
        run: rustup component add clippy
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy -- -D warnings
      - run: cargo build --verbose --release ${{ matrix.args }}
      - run: cargo test --verbose --release ${{ matrix.args }}
